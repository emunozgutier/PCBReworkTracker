<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Rework Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 30px -5px rgba(239, 68, 68, 0.2);
    }
    .badge {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: inline-block;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .url-box {
      background: #020617;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 14px 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1rem;
      color: #38bdf8;
      word-break: break-all;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .stat-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .stat-label {
      color: #94a3b8;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 2px;
    }
    .stat-val {
      font-family: monospace;
      font-size: 0.88rem;
      color: #f1f5f9;
      word-break: break-all;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    button, a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: #6366f1;
      color: #ffffff;
    }
    .btn-secondary {
      background: rgba(30, 41, 59, 0.8);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Redirect / BasePath Diagnostic</span>
    <h1>404 — Page Not Found</h1>
    <p>Below is the exact URL received from Caddy or the reverse proxy:</p>

    <div class="url-box" id="full-url">Loading URL…</div>

    <div class="grid">
      <div class="stat-box">
        <span class="stat-label">Origin</span>
        <span class="stat-val" id="stat-origin">-</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Pathname</span>
        <span class="stat-val" id="stat-pathname" style="color: #facc15;">-</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Query Search</span>
        <span class="stat-val" id="stat-search">-</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Referrer</span>
        <span class="stat-val" id="stat-referrer">-</span>
      </div>
    </div>

    <div class="actions">
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-primary" onclick="window.location.href='/'">Return to /</button>
        <button class="btn btn-primary" onclick="window.location.href='/RT/'">Return to /RT/</button>
      </div>
      <button class="btn btn-secondary" id="copy-btn" onclick="copyUrl()">Copy URL</button>
    </div>
  </div>

  <script>
    document.getElementById('full-url').textContent = window.location.href;
    document.getElementById('stat-origin').textContent = window.location.origin;
    document.getElementById('stat-pathname').textContent = window.location.pathname;
    document.getElementById('stat-search').textContent = window.location.search || '(none)';
    document.getElementById('stat-referrer').textContent = document.referrer || '(direct navigation)';

    function copyUrl() {
      navigator.clipboard.writeText(window.location.href);
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy URL'; }, 2000);
    }
  </script>
</body>
</html>
