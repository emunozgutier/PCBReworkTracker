version: '3.8'

services:
  rework-tracker:
    build: .
    container_name: rework-tracker-app
    ports:
      - "5001:5001"
      - "5002:5002"
    volumes:
      # Use named volumes to persist the database and media uploads
      - db_data:/usr/src/app/src/store/serverDataBase/data
      - docs_data:/usr/src/app/src/store/serverDataBase/docs
      - pictures_data:/usr/src/app/src/store/serverDataBase/pictures
      - logs_data:/usr/src/app/src/store/serverDataBase/logs
    restart: unless-stopped

volumes:
  db_data:
  docs_data:
  pictures_data:
  logs_data:
